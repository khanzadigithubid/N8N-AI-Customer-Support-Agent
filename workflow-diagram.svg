<svg viewBox="0 0 1100 680" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">

  <!-- Background -->
  <rect width="1100" height="680" fill="#0f172a" rx="16"/>

  <!-- Title -->
  <text x="550" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#f1f5f9">🤖 AI Customer Support Agent</text>
  <text x="550" y="66" text-anchor="middle" font-size="13" fill="#94a3b8">n8n + OpenAI GPT-4o-mini Workflow</text>

  <!-- ── STEP 1: Customer ── -->
  <rect x="20" y="120" width="120" height="72" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <text x="80" y="152" text-anchor="middle" font-size="20">👤</text>
  <text x="80" y="170" text-anchor="middle" font-size="11" font-weight="bold" fill="#e2e8f0">Customer</text>
  <text x="80" y="184" text-anchor="middle" font-size="9" fill="#94a3b8">Sends message</text>

  <!-- Arrow 1→2 -->
  <line x1="140" y1="156" x2="178" y2="156" stroke="#6366f1" stroke-width="2" marker-end="url(#a1)"/>
  <text x="159" y="149" text-anchor="middle" font-size="9" fill="#94a3b8">POST</text>

  <!-- ── STEP 2: Webhook ── -->
  <rect x="178" y="112" width="140" height="88" rx="12" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <text x="248" y="138" text-anchor="middle" font-size="11" font-weight="bold" fill="#22d3ee">🔗 Webhook</text>
  <text x="248" y="153" text-anchor="middle" font-size="10" fill="#cbd5e1">Customer Message</text>
  <text x="248" y="167" text-anchor="middle" font-size="9" fill="#94a3b8">Receives POST request</text>
  <text x="248" y="181" text-anchor="middle" font-size="9" fill="#64748b">{ message, sessionId }</text>
  <text x="248" y="194" text-anchor="middle" font-size="9" fill="#64748b">path: /support-agent</text>

  <!-- Arrow 2→3 -->
  <line x1="318" y1="156" x2="356" y2="156" stroke="#22d3ee" stroke-width="2" marker-end="url(#a2)"/>

  <!-- ── STEP 3: AI Agent ── -->
  <rect x="356" y="100" width="160" height="112" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="2.5"/>
  <text x="436" y="124" text-anchor="middle" font-size="11" font-weight="bold" fill="#a855f7">🧠 AI Support Agent</text>
  <text x="436" y="140" text-anchor="middle" font-size="10" fill="#cbd5e1">LangChain Agent</text>
  <text x="436" y="155" text-anchor="middle" font-size="9" fill="#94a3b8">System Prompt:</text>
  <text x="436" y="168" text-anchor="middle" font-size="9" fill="#64748b">• Company info &amp; rules</text>
  <text x="436" y="181" text-anchor="middle" font-size="9" fill="#64748b">• Language detection</text>
  <text x="436" y="194" text-anchor="middle" font-size="9" fill="#64748b">• [HANDOFF] tag rule</text>

  <!-- ── OpenAI (sub-node) ── -->
  <rect x="270" y="268" width="148" height="68" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="344" y="292" text-anchor="middle" font-size="11" font-weight="bold" fill="#10b981">⚡ OpenAI</text>
  <text x="344" y="308" text-anchor="middle" font-size="10" fill="#cbd5e1">GPT-4o-mini</text>
  <text x="344" y="322" text-anchor="middle" font-size="9" fill="#94a3b8">temperature: 0.3</text>
  <line x1="344" y1="268" x2="400" y2="212" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a3)"/>
  <text x="358" y="246" text-anchor="middle" font-size="9" fill="#10b981">LLM</text>

  <!-- ── Memory (sub-node) ── -->
  <rect x="438" y="268" width="148" height="68" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="512" y="292" text-anchor="middle" font-size="11" font-weight="bold" fill="#f59e0b">💾 Memory</text>
  <text x="512" y="308" text-anchor="middle" font-size="10" fill="#cbd5e1">Window Buffer</text>
  <text x="512" y="322" text-anchor="middle" font-size="9" fill="#94a3b8">last 10 exchanges</text>
  <line x1="490" y1="268" x2="466" y2="212" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a4)"/>
  <text x="492" y="246" text-anchor="middle" font-size="9" fill="#f59e0b">Context</text>

  <!-- Arrow 3→4 -->
  <line x1="516" y1="156" x2="556" y2="156" stroke="#a855f7" stroke-width="2" marker-end="url(#a5)"/>

  <!-- ── STEP 4: Check Handoff ── -->
  <rect x="556" y="112" width="156" height="88" rx="12" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
  <text x="634" y="137" text-anchor="middle" font-size="11" font-weight="bold" fill="#f97316">🔀 Check Handoff</text>
  <text x="634" y="153" text-anchor="middle" font-size="10" fill="#cbd5e1">Sets needsHuman flag</text>
  <text x="634" y="167" text-anchor="middle" font-size="9" fill="#94a3b8">true  → [HANDOFF] found</text>
  <text x="634" y="180" text-anchor="middle" font-size="9" fill="#94a3b8">false → normal reply</text>
  <text x="634" y="193" text-anchor="middle" font-size="9" fill="#64748b">also passes sessionId,</text>
  <!-- no branching here, straight arrow to Send Reply -->

  <!-- Arrow 4→5 -->
  <line x1="712" y1="156" x2="752" y2="156" stroke="#f97316" stroke-width="2" marker-end="url(#a6)"/>

  <!-- ── STEP 5: Send Reply ── -->
  <rect x="752" y="112" width="140" height="88" rx="12" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <text x="822" y="137" text-anchor="middle" font-size="11" font-weight="bold" fill="#22d3ee">📤 Send Reply</text>
  <text x="822" y="153" text-anchor="middle" font-size="10" fill="#cbd5e1">Respond to Webhook</text>
  <text x="822" y="168" text-anchor="middle" font-size="9" fill="#94a3b8">{ reply,</text>
  <text x="822" y="181" text-anchor="middle" font-size="9" fill="#94a3b8">needsHuman }</text>
  <text x="822" y="194" text-anchor="middle" font-size="9" fill="#64748b">JSON response</text>

  <!-- Arrow 5→6 -->
  <line x1="892" y1="156" x2="932" y2="156" stroke="#22d3ee" stroke-width="2" marker-end="url(#a2)"/>

  <!-- ── STEP 6: IF Node ── -->
  <rect x="932" y="112" width="148" height="88" rx="12" fill="#1e293b" stroke="#e879f9" stroke-width="2.5"/>
  <text x="1006" y="137" text-anchor="middle" font-size="11" font-weight="bold" fill="#e879f9">❓ Needs Human?</text>
  <text x="1006" y="153" text-anchor="middle" font-size="10" fill="#cbd5e1">IF node</text>
  <text x="1006" y="168" text-anchor="middle" font-size="9" fill="#94a3b8">needsHuman == true</text>
  <text x="1006" y="181" text-anchor="middle" font-size="9" fill="#64748b">True  → branch 1</text>
  <text x="1006" y="194" text-anchor="middle" font-size="9" fill="#64748b">False → branch 2 (end)</text>

  <!-- Arrow IF → Gmail (true branch, goes down) -->
  <line x1="1006" y1="200" x2="1006" y2="370" stroke="#ef4444" stroke-width="2" marker-end="url(#aRed)"/>
  <text x="1016" y="290" font-size="9" fill="#ef4444">true</text>

  <!-- Arrow IF → end (false branch, goes right) -->
  <line x1="1080" y1="156" x2="1080" y2="260" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,3"/>
  <rect x="1044" y="260" width="72" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="1080" y="282" text-anchor="middle" font-size="10" fill="#64748b">✅ End</text>
  <text x="1092" y="149" font-size="9" fill="#475569">false</text>

  <!-- ── STEP 7: Gmail Alert ── -->
  <rect x="926" y="370" width="160" height="88" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2.5"/>
  <text x="1006" y="396" text-anchor="middle" font-size="11" font-weight="bold" fill="#ef4444">📧 Alert Team</text>
  <text x="1006" y="412" text-anchor="middle" font-size="10" fill="#cbd5e1">Gmail Node</text>
  <text x="1006" y="426" text-anchor="middle" font-size="9" fill="#94a3b8">Sends email to support</text>
  <text x="1006" y="440" text-anchor="middle" font-size="9" fill="#64748b">team with session ID</text>
  <text x="1006" y="453" text-anchor="middle" font-size="9" fill="#64748b">&amp; customer message</text>

  <!-- ── Legend ── -->
  <rect x="20" y="500" width="1060" height="158" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="550" y="522" text-anchor="middle" font-size="13" font-weight="bold" fill="#e2e8f0">📌 Workflow Summary</text>

  <circle cx="50" cy="546" r="6" fill="#22d3ee"/>
  <text x="64" y="550" font-size="11" fill="#cbd5e1">Webhook: receives POST { message, sessionId } from any frontend</text>

  <circle cx="50" cy="568" r="6" fill="#a855f7"/>
  <text x="64" y="572" font-size="11" fill="#cbd5e1">AI Agent: generates reply using GPT-4o-mini with company system prompt</text>

  <circle cx="50" cy="590" r="6" fill="#10b981"/>
  <text x="64" y="594" font-size="11" fill="#cbd5e1">OpenAI GPT-4o-mini: language model at temperature 0.3</text>

  <circle cx="50" cy="612" r="6" fill="#f59e0b"/>
  <text x="64" y="616" font-size="11" fill="#cbd5e1">Memory: stores last 10 exchanges (question + answer pairs) per session</text>

  <circle cx="550" cy="546" r="6" fill="#f97316"/>
  <text x="564" y="550" font-size="11" fill="#cbd5e1">Check Handoff: sets needsHuman flag — does NOT branch here</text>

  <circle cx="550" cy="568" r="6" fill="#22d3ee"/>
  <text x="564" y="572" font-size="11" fill="#cbd5e1">Send Reply: always returns JSON { reply, needsHuman } to caller</text>

  <circle cx="550" cy="590" r="6" fill="#e879f9"/>
  <text x="564" y="594" font-size="11" fill="#cbd5e1">Needs Human? (IF): branches AFTER reply is sent</text>

  <circle cx="550" cy="612" r="6" fill="#ef4444"/>
  <text x="564" y="616" font-size="11" fill="#cbd5e1">Alert Team (Gmail): sends email alert to support team on handoff</text>

  <text x="550" y="644" text-anchor="middle" font-size="10" fill="#475569">⚠️ Add your Gmail credential and set support-team@demostore.com before activating</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6366f1"/>
    </marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#22d3ee"/>
    </marker>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
    </marker>
    <marker id="a4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/>
    </marker>
    <marker id="a5" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#a855f7"/>
    </marker>
    <marker id="a6" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f97316"/>
    </marker>
    <marker id="aRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/>
    </marker>
  </defs>

</svg>
