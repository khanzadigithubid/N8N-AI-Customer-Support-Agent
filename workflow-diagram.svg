<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">

  <!-- Background -->
  <rect width="900" height="620" fill="#0f172a" rx="16"/>

  <!-- Title -->
  <text x="450" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#f1f5f9">🤖 AI Customer Support Agent</text>
  <text x="450" y="66" text-anchor="middle" font-size="13" fill="#94a3b8">n8n + OpenAI GPT-4o-mini Workflow</text>

  <!-- STEP 1: Customer -->
  <rect x="30" y="110" width="140" height="80" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <text x="100" y="145" text-anchor="middle" font-size="22">👤</text>
  <text x="100" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#e2e8f0">Customer</text>
  <text x="100" y="180" text-anchor="middle" font-size="10" fill="#94a3b8">Sends a message</text>

  <!-- Arrow 1→2 -->
  <line x1="170" y1="150" x2="210" y2="150" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="190" y="143" text-anchor="middle" font-size="9" fill="#94a3b8">POST</text>

  <!-- STEP 2: Webhook -->
  <rect x="210" y="110" width="150" height="80" rx="12" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <text x="285" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#22d3ee">🔗 Webhook</text>
  <text x="285" y="156" text-anchor="middle" font-size="10" fill="#cbd5e1">Customer Message</text>
  <text x="285" y="170" text-anchor="middle" font-size="9" fill="#94a3b8">Receives POST request</text>
  <text x="285" y="183" text-anchor="middle" font-size="9" fill="#64748b">{ message, sessionId }</text>

  <!-- Arrow 2→3 -->
  <line x1="360" y1="150" x2="400" y2="150" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- STEP 3: AI Agent -->
  <rect x="400" y="90" width="170" height="120" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="2.5"/>
  <text x="485" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#a855f7">🧠 AI Support Agent</text>
  <text x="485" y="135" text-anchor="middle" font-size="10" fill="#cbd5e1">LangChain Agent</text>
  <text x="485" y="152" text-anchor="middle" font-size="9" fill="#94a3b8">System Prompt:</text>
  <text x="485" y="165" text-anchor="middle" font-size="9" fill="#64748b">• Company info</text>
  <text x="485" y="178" text-anchor="middle" font-size="9" fill="#64748b">• Language detection</text>
  <text x="485" y="191" text-anchor="middle" font-size="9" fill="#64748b">• Handoff rules</text>

  <!-- OpenAI -->
  <rect x="310" y="270" width="150" height="70" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="385" y="296" text-anchor="middle" font-size="11" font-weight="bold" fill="#10b981">⚡ OpenAI</text>
  <text x="385" y="312" text-anchor="middle" font-size="10" fill="#cbd5e1">GPT-4o-mini</text>
  <text x="385" y="326" text-anchor="middle" font-size="9" fill="#94a3b8">temp: 0.3</text>

  <line x1="385" y1="270" x2="450" y2="210" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow3)"/>
  <text x="400" y="245" text-anchor="middle" font-size="9" fill="#10b981">LLM</text>

  <!-- Memory -->
  <rect x="490" y="270" width="150" height="70" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="565" y="296" text-anchor="middle" font-size="11" font-weight="bold" fill="#f59e0b">💾 Memory</text>
  <text x="565" y="312" text-anchor="middle" font-size="10" fill="#cbd5e1">Window Buffer</text>
  <text x="565" y="326" text-anchor="middle" font-size="9" fill="#94a3b8">last 10 messages</text>

  <line x1="530" y1="270" x2="510" y2="210" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow4)"/>
  <text x="534" y="245" text-anchor="middle" font-size="9" fill="#f59e0b">Context</text>

  <!-- Arrow 3→4 -->
  <line x1="570" y1="150" x2="615" y2="150" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow5)"/>

  <!-- STEP 4: Check Handoff -->
  <rect x="615" y="110" width="150" height="80" rx="12" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
  <text x="690" y="138" text-anchor="middle" font-size="11" font-weight="bold" fill="#f97316">🔀 Check Handoff</text>
  <text x="690" y="155" text-anchor="middle" font-size="10" fill="#cbd5e1">Detects [HANDOFF]</text>
  <text x="690" y="170" text-anchor="middle" font-size="9" fill="#94a3b8">tag in AI reply</text>
  <text x="690" y="183" text-anchor="middle" font-size="9" fill="#64748b">needsHuman = true/false</text>

  <!-- Arrow 4→5 -->
  <line x1="765" y1="150" x2="800" y2="150" stroke="#f97316" stroke-width="2" marker-end="url(#arrow6)"/>

  <!-- STEP 5: Send Reply -->
  <rect x="800" y="110" width="80" height="80" rx="12" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <text x="840" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#22d3ee">📤 Send</text>
  <text x="840" y="155" text-anchor="middle" font-size="10" fill="#cbd5e1">Reply</text>
  <text x="840" y="170" text-anchor="middle" font-size="9" fill="#94a3b8">JSON</text>
  <text x="840" y="183" text-anchor="middle" font-size="9" fill="#64748b">response</text>

  <!-- HANDOFF path -->
  <line x1="690" y1="190" x2="690" y2="370" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="6,3" marker-end="url(#arrowRed)"/>
  <rect x="610" y="370" width="160" height="70" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="690" y="396" text-anchor="middle" font-size="11" font-weight="bold" fill="#ef4444">🙋 Human Agent</text>
  <text x="690" y="413" text-anchor="middle" font-size="10" fill="#cbd5e1">Escalation</text>
  <text x="690" y="428" text-anchor="middle" font-size="9" fill="#94a3b8">needsHuman: true</text>
  <text x="700" y="355" font-size="9" fill="#ef4444">HANDOFF</text>

  <!-- Normal reply path -->
  <line x1="840" y1="190" x2="840" y2="370" stroke="#22d3ee" stroke-width="1.8" stroke-dasharray="6,3" marker-end="url(#arrow2)"/>
  <rect x="770" y="370" width="140" height="70" rx="10" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <text x="840" y="396" text-anchor="middle" font-size="11" font-weight="bold" fill="#22d3ee">✅ Auto Reply</text>
  <text x="840" y="413" text-anchor="middle" font-size="10" fill="#cbd5e1">AI Response</text>
  <text x="840" y="428" text-anchor="middle" font-size="9" fill="#94a3b8">needsHuman: false</text>
  <text x="850" y="355" font-size="9" fill="#22d3ee">AUTO</text>

  <!-- Legend -->
  <rect x="30" y="480" width="830" height="115" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="445" y="502" text-anchor="middle" font-size="12" font-weight="bold" fill="#e2e8f0">📌 Workflow Summary</text>
  <circle cx="65" cy="525" r="6" fill="#22d3ee"/>
  <text x="78" y="529" font-size="11" fill="#cbd5e1">Webhook: receives customer message via POST</text>
  <circle cx="65" cy="548" r="6" fill="#a855f7"/>
  <text x="78" y="552" font-size="11" fill="#cbd5e1">AI Agent: generates reply using GPT-4o-mini + memory</text>
  <circle cx="65" cy="571" r="6" fill="#f97316"/>
  <text x="78" y="575" font-size="11" fill="#cbd5e1">Check Handoff: if [HANDOFF] tag found → escalate to human</text>
  <circle cx="480" cy="525" r="6" fill="#10b981"/>
  <text x="493" y="529" font-size="11" fill="#cbd5e1">OpenAI GPT-4o-mini: language model (temp 0.3)</text>
  <circle cx="480" cy="548" r="6" fill="#f59e0b"/>
  <text x="493" y="552" font-size="11" fill="#cbd5e1">Memory: stores last 10 messages per session</text>
  <circle cx="480" cy="571" r="6" fill="#ef4444"/>
  <text x="493" y="575" font-size="11" fill="#cbd5e1">Human Handoff: angry/refund/unknown → human team</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6366f1"/>
    </marker>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrow3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
    </marker>
    <marker id="arrow4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow5" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#a855f7"/>
    </marker>
    <marker id="arrow6" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f97316"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/>
    </marker>
  </defs>

</svg>
